# ============================================================================
# API de gestion des etudiants - configuration locale
# ----------------------------------------------------------------------------
# Le serveur MySQL doit etre demarre sur le port 3306 avec la base studentdb.
# ============================================================================

server.port=8080

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/studentdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Documentation OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

logging.level.root=WARN
logging.level.com.example.studentmanagement=INFO
